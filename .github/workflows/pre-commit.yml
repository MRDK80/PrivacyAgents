name: pre-commit
on:
  push:
    branches: ["roadmap/**"]
  pull_request:
    branches: ["roadmap/**"]
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pre-commit run --all-files
